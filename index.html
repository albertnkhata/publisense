<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publisense — The Public Ledger for Product Feedback &amp; Ideas</title>
    <meta name="description" content="Crowdsourced product feedback & discovery. Log bugs, share wishlists, discover community workarounds, and see which teams actually listen." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/publisense-icon-white-on-indigo.svg" />
    <link rel="icon" type="image/png" sizes="120x120" href="/brand/publisense-google-120.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
    <meta property="og:image" content="https://publisense.app/brand/publisense-icon-512.png" />
    <meta property="og:image:alt" content="Publisense" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('publisense_theme') || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
