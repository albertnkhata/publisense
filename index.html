    <script>
      (function() {
        try {
          var raw = localStorage.getItem('crowdpulse_settings');
          var isDark = true;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme === 'light') isDark = false;
            else if (parsed.theme === 'dark') isDark = true;
            else if (parsed.theme === 'system') {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } else {
            var legacy = localStorage.getItem('signalpulse_theme');
            if (legacy === 'light') isDark = false;
            else if (legacy === 'dark') isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
