<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Publisense</title>
    <meta name="description" content="Public feedback boards for the products you use. Upvote, follow and share feedback with the teams who build your tools." />
    <link rel="canonical" href="https://publisense.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0047AB" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Publisense" />
    <meta property="og:title" content="Publisense" />
    <meta property="og:description" content="Public feedback boards for the products you use. Upvote, follow and share feedback with the teams who build your tools." />
    <meta property="og:url" content="https://publisense.app/" />
    <meta property="og:image" content="https://publisense.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Publisense: public feedback boards for the products you use" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@publisensehq" />
    <meta name="twitter:title" content="Publisense" />
    <meta name="twitter:description" content="Public feedback boards for the products you use. Upvote, follow and share feedback with the teams who build your tools." />
    <meta name="twitter:image" content="https://publisense.app/og.png" />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      // Mirrors src/lib/theme.ts (storage key and values must stay in sync).
      (function () {
        try {
          var pref = localStorage.getItem('publisense:theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
