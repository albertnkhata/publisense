name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: v2 web (typecheck, test, style gates, build)
    runs-on: ubuntu-latest
    # Each step sets working-directory itself (rather than `defaults.run`) so
    # scripts/status.mjs, which reads step names and run lines, parses it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test

      # FOUNDATION section 3: no arbitrary values, no raw hex outside
      # theme.css, no inline style except CSS custom properties.
      - name: Style gate
        working-directory: web
        run: node scripts/check-style.mjs

      - name: Build
        working-directory: web
        run: npm run build

      # The theme is locked (--*: initial), so a class naming an undefined
      # token compiles to nothing. Fail instead of shipping it silently.
      - name: Every utility class produces CSS
        working-directory: web
        run: node scripts/check-classes.mjs

      - name: Assert no service_role key in bundle
        working-directory: web
        run: |
          # The service_role key bypasses RLS entirely. It must never reach a
          # client bundle. If this fails, do not ship.
          if grep -rqE 'service_role' dist/; then
            echo "::error::service_role referenced in the v2 client bundle"
            exit 1
          fi
          echo "OK: no service_role in v2 bundle"

  status:
    name: Status ledger is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # STATUS.md is generated, so a stale copy means the reading surface lies.
      # The script has no dependencies (and the repo root has no package.json since
      # v1 was removed), so it runs on plain node. This compares the repo-derived
      # block only; the live block runs on its own schedule.
      - name: Regenerate and compare the repo-derived block
        run: node scripts/status.mjs --check

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: publisense_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # Supabase ships an `auth` schema (auth.users, auth.uid()) that plain
      # Postgres does not have. The migrations legitimately depend on it —
      # 0004 triggers on auth.users, and every 0006 policy is gated on
      # auth.uid() — so the harness provides a faithful stub rather than the
      # migrations being bent to avoid it. This is what Supabase's own local
      # development stack does.
      - name: Stub the Supabase auth schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;

          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text unique,
            raw_user_meta_data jsonb default '{}'::jsonb,
            email_confirmed_at timestamptz,
            deleted_at timestamptz,
            created_at timestamptz not null default now()
          );

          -- Mirrors Supabase's auth.uid(): the caller's id, as set by
          -- PostgREST in request.jwt.claim.sub, or null outside a request.
          create or replace function auth.uid() returns uuid
          language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;

          -- Supabase's PostgREST roles. Policies in 0006 are granted
          -- `to authenticated` / `to anon`, which plain Postgres lacks.
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end
          $$;
          SQL

      # Storage, the API roles' use of auth, and Supabase's default grants: what the
      # v2 migrations (0016-0020) and their tests rely on beyond auth.users.
      - name: Stub the rest of the Supabase platform
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql

      - name: Apply schema then migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 \
            -f supabase/schema.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--- applying $f"
            psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Assert RLS is enabled on every public table
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Any public table without RLS is world-writable via PostgREST.
          OPEN=$(psql -h localhost -U postgres -d publisense_ci -tAc "
            select tablename from pg_tables
            where schemaname='public' and not rowsecurity
          ")
          if [ -n "$OPEN" ]; then
            echo "::error::RLS disabled on: $OPEN"
            exit 1
          fi
          echo "OK: RLS enabled on every public table"

      - name: Assert no world-open write policy exists
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Public SELECT is intended (the 'public reads' half of the design).
          # A permissive INSERT/UPDATE/DELETE policy is not — that is the exact
          # bug that schema.sql carried and that locking RLS removed.
          BAD=$(psql -h localhost -U postgres -d publisense_ci -tAc "
            select tablename || ' ' || policyname || ' ' || cmd
            from pg_policies
            where schemaname='public'
              and cmd in ('INSERT','UPDATE','DELETE','ALL')
              and (coalesce(qual::text,'') in ('true','(true)')
                or coalesce(with_check::text,'') in ('true','(true)'))
          ")
          if [ -n "$BAD" ]; then
            echo "::error::world-open write policy: $BAD"
            exit 1
          fi
          echo "OK: no world-open write policies"

      # FOUNDATION section 8, exercised as the real API roles: column grants, RLS,
      # triggers and RPCs together. Runs in a transaction that rolls back.
      - name: v2 permission tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_rls_test.sql

      # Which SECURITY DEFINER functions anon can execute: anything not on the
      # allow-list fails (#139). Postgres grants EXECUTE to PUBLIC by default.
      - name: v2 definer function grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_definer_grants_test.sql

      # A company's name history: renames keep the old name, a former slug still resolves,
      # and no other company can take a slug that once belonged to someone else.
      - name: v2 company name-history tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_hub_names_test.sql

      # Local sample content must keep applying (twice, to prove it is idempotent).
      # It is never applied to production.
      - name: v2 dev seed applies
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_seed_dev.sql
          psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_seed_dev.sql

      # The nightly production smoke suite must also pass here, on the seeded CI
      # database, so a schema change that would break it fails the PR first.
      - name: Live smoke suite (on CI data)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_live_smoke.sql

      # Notification emails inside the 15-minute window are held and the latest one
      # is sent when it closes (#145). Stubs pg_net and Vault inside a rolled-back
      # transaction, so it needs the seeded CI database and never runs elsewhere.
      - name: v2 email batching tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_email_batching_test.sql

      # Vote counts are public, who voted is not (#140). Needs the seeded CI database.
      - name: v2 vote privacy tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_vote_privacy_test.sql

      # Feedback-loop polish (PR #172 follow-up, 0043-0045): merged permalinks readable,
      # one notification and one email per status change with a note, the author edit
      # window. Stubs pg_net and Vault in a rolled-back transaction; needs the seeded CI database.
      - name: v2 feedback loop tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_feedback_loop_test.sql

      # Product decisions (0046): a reason on every rejection, an optional note on approval,
      # the decision record readable by its submitter and staff only, and the submitter's
      # email through the existing pipeline. Stubs pg_net and Vault in a rolled-back
      # transaction; needs the CI database.
      - name: v2 product decision tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_product_decision_test.sql

      # Join request messages (0049, #189): length, trimming, who reads them, the
      # notification payload, and that the old three-argument call still works.
      - name: v2 join message tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_join_message_test.sql

      # Visibility helpers (0047, #179): no public helper takes a caller-chosen uid, so
      # neither a signed-out visitor nor another member can ask "can user X see Y?";
      # the creator, team and blocked users get the same answers about themselves, and
      # the policies and triggers built on the private helpers still hold. Rolled back.
      - name: v2 helper oracle tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_helper_oracle_test.sql

      # Reply threads (0050): replies nest at any depth, notifications follow the real
      # parent (an official parent reaches the team), @mentions and @<board slug> notify
      # without doubling up, deleting a reply takes its subtree, and the claim-code
      # limit returns retry_after (#183). Rolled back.
      - name: v2 reply threads tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d publisense_ci -v ON_ERROR_STOP=1 -qtA -f supabase/tests/v2_reply_threads_test.sql

      - name: Report public read-policy count
        env:
          PGPASSWORD: postgres
        run: |
          N=$(psql -h localhost -U postgres -d publisense_ci -tAc \
            "select count(*) from pg_policies where schemaname='public'")
          echo "Total public policies after migrations: $N"
