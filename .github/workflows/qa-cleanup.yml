# Appendix A check 8.5: guarded QA fixture cleanup runner.
#
# Deletes ONLY the explicit Appendix A QA boards (and their cascading posts, replies,
# votes, follows, singleton QA hubs) and the two QA launch test accounts (+launch-m
# and +launch-r), refusing to touch any platform_admin or sole-owned non-QA board.
#
# Because this repository is public, logs print counts and slugs only — never raw
# personal emails or user UUIDs.
name: QA fixture cleanup (Check 8.5)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "cleanup-check-8.5" to execute the cleanup (any other value runs a rolled-back dry run)'
        required: true
        default: 'dry-run'
        type: string

permissions:
  contents: read

concurrency:
  group: qa-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Check 8.5 cleanup (transactional)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ -n "$DB" ] || { echo "::error::SUPABASE_DB_URL secret is not set"; exit 1; }
          DB=$(printf '%s' "$DB" | tr -d '\r\n')

          if [ "$CONFIRM" = "cleanup-check-8.5" ]; then
            END_TX="COMMIT;"
            echo "Mode: LIVE CLEANUP (COMMIT)"
          else
            END_TX="ROLLBACK;"
            echo "Mode: DRY RUN (ROLLBACK)"
          fi

          psql "$DB" -v ON_ERROR_STOP=1 <<SQL
          BEGIN;

          DO \$cleanup\$
          DECLARE
            v_board_slugs text[] := array[
              'qa-launch-fixture-2026-11-22',
              'qa-launch-review-fixture-306-2',
              'publisense-qa-test',
              'tailwind'
            ];
            v_qa_emails text[] := array[
              'albertnkhata.s+launch-m@gmail.com',
              'albertnkhata.s+launch-r@gmail.com'
            ];
            b_ids uuid[];
            h_ids uuid[];
            p_ids uuid[];
            u_ids uuid[];
            n_posts int := 0;
            n_boards int := 0;
            n_hubs int := 0;
            n_users int := 0;
            n_events int := 0;
          BEGIN
            select coalesce(array_agg(id), '{}'::uuid[]) into b_ids
              from public.board
             where slug = any(v_board_slugs);

            -- Singleton hubs used exclusively by the QA boards being removed.
            select coalesce(array_agg(distinct b.hub_id), '{}'::uuid[]) into h_ids
              from public.board b
             where b.id = any(b_ids)
               and b.hub_id is not null
               and not exists (
                 select 1 from public.board other
                  where other.hub_id = b.hub_id
                    and not (other.id = any(b_ids))
               );

            select coalesce(array_agg(id), '{}'::uuid[]) into p_ids
              from public.post
             where board_id = any(b_ids);

            select coalesce(array_agg(id), '{}'::uuid[]) into u_ids
              from auth.users
             where lower(btrim(email)) = any(v_qa_emails);

            raise notice 'Matched boards: %, posts: %, singleton hubs: %, QA accounts: %',
              cardinality(b_ids), cardinality(p_ids), cardinality(h_ids), cardinality(u_ids);

            -- Safety guard: never delete a platform admin.
            if exists (select 1 from public.platform_admin where user_id = any(u_ids)) then
              raise exception 'Refusing cleanup: one of the target QA accounts is a platform_admin';
            end if;

            -- Unclaim QA boards/hubs first so v2_guard_last_owner allows deleting memberships.
            update public.board set claimed_at = null where id = any(b_ids);
            update public.hub   set claimed_at = null where id = any(h_ids);

            -- Clean polymorphic rows pointing at QA boards, hubs, and posts.
            delete from public.follow
             where (target = 'board' and target_id = any(b_ids))
                or (target = 'hub'   and target_id = any(h_ids))
                or (target = 'post'  and target_id = any(p_ids));
            delete from public.membership
             where (scope = 'board' and scope_id = any(b_ids))
                or (scope = 'hub'   and scope_id = any(h_ids));
            delete from public.join_request
             where (scope = 'board' and scope_id = any(b_ids))
                or (scope = 'hub'   and scope_id = any(h_ids));
            delete from public.ownership_dispute
             where (scope = 'board' and scope_id = any(b_ids))
                or (scope = 'hub'   and scope_id = any(h_ids));
            delete from public.block
             where (scope = 'board' and scope_id = any(b_ids))
                or (scope = 'hub'   and scope_id = any(h_ids));
            delete from public.notification
             where (target_type = 'board' and target_id = any(b_ids))
                or (target_type = 'hub'   and target_id = any(h_ids))
                or (target_type = 'post'  and target_id = any(p_ids));
            if to_regclass('private.scope_webhook') is not null then
              delete from private.scope_webhook
               where (scope = 'board' and scope_id = any(b_ids))
                  or (scope = 'hub'   and scope_id = any(h_ids));
            end if;
            if to_regclass('private.scope_inbound_token') is not null then
              delete from private.scope_inbound_token
               where (scope = 'board' and scope_id = any(b_ids))
                  or (scope = 'hub'   and scope_id = any(h_ids));
            end if;
            delete from public.report
             where (target = 'post' and target_id = any(p_ids))
                or (target = 'reply' and target_id in (select id from public.reply where post_id = any(p_ids)));
            delete from public.post_draft
             where board_id = any(b_ids);

            -- Remove analytics events and daily rollups for the QA boards/hubs before deleting boards (board_id is ON DELETE SET NULL).
            delete from private.analytics_event
             where board_id = any(b_ids)
                or hub_id = any(h_ids)
                or path like '/b/qa-launch-fixture-2026-11-22%'
                or path like '/b/qa-launch-review-fixture-306-2%'
                or path like '/b/publisense-qa-test%'
                or path like '/b/tailwind%';
            get diagnostics n_events = row_count;
            delete from private.analytics_daily where board_id = any(b_ids);

            -- Delete QA boards (cascades posts, replies, votes, status_events, merge_records, board_decision, post notifications).
            n_posts := cardinality(p_ids);
            delete from public.board where id = any(b_ids);
            get diagnostics n_boards = row_count;

            -- Delete singleton QA hubs (cascades hub_domain, hub_name).
            delete from public.hub where id = any(h_ids);
            get diagnostics n_hubs = row_count;

            -- Safety guard: ensure target QA accounts are not sole owners of any remaining claimed board/hub.
            if exists (
              select 1 from public.membership m
               where m.user_id = any(u_ids) and m.role = 'owner'
                 and not exists (
                   select 1 from public.membership other
                    where other.scope = m.scope and other.scope_id = m.scope_id
                      and other.role = 'owner' and not (other.user_id = any(u_ids))
                 )
            ) then
              raise exception 'Refusing cleanup: target QA account is sole owner of a remaining board/hub';
            end if;

            -- Clean polymorphic user refs and detach any storage.objects ownership before deleting auth.users.
            delete from public.follow where target = 'user' and target_id = any(u_ids);
            delete from public.notification where target_type = 'user' and target_id = any(u_ids);
            if to_regclass('storage.objects') is not null
               and exists (select 1 from storage.objects where owner = any(u_ids)) then
              update storage.objects set owner = null where owner = any(u_ids);
            end if;

            -- Delete QA test accounts (cascades profile, memberships, votes, prefs, DMs, tokens, analytics_excluded_user).
            delete from auth.users where id = any(u_ids);
            get diagnostics n_users = row_count;

            raise notice 'Deleted boards: %, posts (cascaded): %, hubs: %, QA users: %, QA analytics events: %',
              n_boards, n_posts, n_hubs, n_users, n_events;
          END \$cleanup\$;

          $END_TX

          -- Post-check summary (slugs and counts only, zero PII).
          select count(*) as remaining_target_boards
            from public.board
           where slug in ('qa-launch-fixture-2026-11-22', 'qa-launch-review-fixture-306-2', 'publisense-qa-test', 'tailwind');

          select count(*) as remaining_target_qa_users
            from auth.users
           where lower(btrim(email)) in ('albertnkhata.s+launch-m@gmail.com', 'albertnkhata.s+launch-r@gmail.com');

          select slug, status, category, post_count
            from public.board
           where category = 'other' and status = 'live'
           order by slug;
          SQL
