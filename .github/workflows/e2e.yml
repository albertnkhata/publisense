# Browser smoke test of the real sign-in flow on PRODUCTION (D-003).
# Opens the sign-in dialog, has the live auth server refuse a wrong password
# (an address on the reserved .invalid domain, so no account and no email), and
# follows Continue with Google to Google's page with our OAuth client.
# A full password sign-in runs too once the E2E_EMAIL and E2E_PASSWORD secrets
# hold a dedicated test account; without them that one test is skipped.
# A failed scheduled run emails the repo owner.
name: Browser sign-in smoke

on:
  schedule:
    - cron: '17 1 * * *' # 01:17 UTC = 03:17 CAT, after the 01:07 live smoke
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.56 cannot install browsers on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Sign-in flow against publisense.app
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
